[workspace]
resolver = "3"
members = ["crates/*", "xtask"]
default-members = ["crates/app"]

[workspace.package]
version = "0.1.0"
edition = "2024"

[workspace.dependencies]
foundation = { path = "crates/foundation" }
platform = { path = "crates/platform" }
secrecy = "0.10"
thiserror = "2"

[workspace.lints.rust]
unsafe_code = "forbid"
