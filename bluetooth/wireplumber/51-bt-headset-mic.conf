# Sony WH-XB910N: всегда режим гарнитуры с микрофоном (HFP CVSD — mSBC не даёт звука в наушники через USB-проброс в VM), без автопереключения на A2DP
wireplumber.settings = {
  bluetooth.autoswitch-to-headset-profile = false
}

device.profile.priority.rules = [
  {
    matches = [ { device.name = "bluez_card.90_7A_58_EB_79_4D" } ]
    actions = {
      update-props = {
        priorities = [ "headset-head-unit-cvsd", "headset-head-unit", "a2dp-sink" ]
      }
    }
  }
]
