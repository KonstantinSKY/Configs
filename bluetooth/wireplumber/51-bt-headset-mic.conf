# Sony WH-XB910N: всегда режим гарнитуры с микрофоном (HFP mSBC; CVSD запасной), без автопереключения на A2DP.
# mSBC работает, т.к. USB-контроллер с BT-адаптером проброшен в VM целиком через VFIO (через QEMU usb-host SCO ломался).
wireplumber.settings = {
  bluetooth.autoswitch-to-headset-profile = false
}

device.profile.priority.rules = [
  {
    matches = [ { device.name = "bluez_card.90_7A_58_EB_79_4D" } ]
    actions = {
      update-props = {
        priorities = [ "headset-head-unit", "headset-head-unit-cvsd", "a2dp-sink" ]
      }
    }
  }
]
