# Вариант для хостов, где mSBC даёт тишину (ноутбук с Realtek 0bda:4853):
# mSBC выключен, режим гарнитуры всегда CVSD. Автопереключение включено:
# музыка в A2DP (LDAC), микрофон гарнитуры, когда его открывает программа.
# Подключение: make -f bluetooth/Makefile headset-config WIREPLUMBER_CONF_NAME=51-bt-headset-cvsd.conf
monitor.bluez.properties = {
  bluez5.enable-msbc = false
}
wireplumber.settings = {
  bluetooth.autoswitch-to-headset-profile = true
}
